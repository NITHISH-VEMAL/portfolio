<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nithish Portfolio GPT</title>
    <!-- Use Tailwind CDN for plain HTML development -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      window.tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: '#2dd4bf',
            },
            animation: {
              'in': 'in 0.3s ease-out',
            },
            keyframes: {
              in: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #212121;
        color: #ececec;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif;
      }
      .ai-message {
        background: transparent;
      }
      .scrollbar-hide::-webkit-scrollbar {
        display: none;
      }
      .scrollbar-hide {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .chat-scroll-area {
        scroll-behavior: smooth;
      }
    </style>
  </head>
  <body class="flex h-screen w-screen overflow-hidden bg-[#212121]">
    <main class="flex-1 flex flex-col bg-[#212121] relative h-full">
      <!-- Header -->
      <header class="h-14 flex items-center px-6 border-b border-white/5 bg-[#212121]/50 backdrop-blur-sm z-50">
        <div class="flex items-center gap-2 text-sm font-semibold text-[#ececec]">
          <div class="w-2 h-2 bg-brand rounded-full animate-pulse"></div>
          Nithish Portfolio GPT v4.5
        </div>
      </header>

      <!-- Chat Area -->
      <div id="chat-scroll-area" class="flex-1 overflow-y-auto scrollbar-hide chat-scroll-area">
        <div id="chat-container" class="max-w-3xl mx-auto w-full py-12 px-4 space-y-4">
          <!-- Messages will be injected here -->
        </div>
      </div>

      <!-- Input Section -->
      <div class="w-full max-w-3xl mx-auto px-4 pb-10">
        <div class="relative">

            </div>
            <div id="command-menu-grid" class="p-2 grid grid-cols-1 sm:grid-cols-2 gap-1 bg-[#252525]">
              <!-- Commands dynamically added -->
            </div>
          </div>

          <!-- Main Command Trigger -->
          <button id="command-trigger" class="w-full h-14 bg-[#2f2f2f] border border-[#3e3e3e] rounded-3xl flex items-center justify-between px-6 hover:border-[#525252] transition-all shadow-xl group">

              <span class="text-[15px]">Select a command to browse portfolio...</span>
            </div>
            <div id="chevron-icon" class="transition-transform duration-200">

const icons = {

  chevronDown: `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>`
};

document.addEventListener('DOMContentLoaded', () => {
  const chatContainer = document.getElementById('chat-container');
  const chatScrollArea = document.getElementById('chat-scroll-area');
  const commandMenu = document.getElementById('command-menu');
  const commandMenuGrid = document.getElementById('command-menu-grid');
  const commandTrigger = document.getElementById('command-trigger');
  const chevronIcon = document.getElementById('chevron-icon');

  let messages = [];
  let isCommandMenuOpen = false;

  function addMessage(role, content) {
    const msgObj = { id: Date.now(), role, content };
    messages.push(msgObj);
    renderMessage(msgObj);
    scrollToBottom();
  }

  function renderMessage(msg) {
    const messageDiv = document.createElement('div');
    messageDiv.className = `flex gap-4 p-6 rounded-3xl transition-all animate-in slide-in-from-bottom-2 duration-300 ${msg.role === 'user' ? 'bg-white/5 ml-8 border border-white/5' : 'ai-message'}`;
    
    const iconHtml = msg.role === 'user' 
      ? `<div class="w-8 h-8 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-[10px]">U</div>`
      : `<div class="w-8 h-8 rounded-full bg-[#2dd4bf] flex items-center justify-center text-black">${icons.code}</div>`;

    messageDiv.innerHTML = `
      <div class="flex-shrink-0">${iconHtml}</div>
      <div class="flex-1 space-y-3">
        <div class="text-[10px] font-bold text-[#676767] uppercase tracking-widest">
          ${msg.role === 'user' ? 'Human' : 'Portfolio AI Agent'}
        </div>
        <div class="text-[14px] leading-relaxed text-[#d1d1d1]">
          ${typeof msg.content === 'string' ? msg.content : ''}
        </div>
      </div>
    `;
    
    if (typeof msg.content !== 'string' && msg.content instanceof HTMLElement) {
      const contentDiv = messageDiv.querySelector('.text-\\[14px\\]');
      contentDiv.appendChild(msg.content);
    } else if (typeof msg.content === 'string') {
        const contentDiv = messageDiv.querySelector('.text-\\[14px\\]');
        contentDiv.innerHTML = msg.content;
    }

    chatContainer.appendChild(messageDiv);
  }

  function showThinking() {
    const thinkingDiv = document.createElement('div');
    thinkingDiv.id = 'thinking-indicator';
    thinkingDiv.className = 'flex gap-4 p-6 rounded-3xl ai-message animate-pulse';
    thinkingDiv.innerHTML = `
      <div class="flex-shrink-0">
        <div class="w-8 h-8 rounded-full bg-[#2dd4bf] flex items-center justify-center text-black">${icons.code}</div>
      </div>
      <div class="flex-1 space-y-3">
        <div class="text-[10px] font-bold text-[#676767] uppercase tracking-widest">Portfolio AI Agent</div>
        <div class="flex items-center gap-2 text-[#676767] italic text-[14px]">
          <span class="animate-spin text-[#2dd4bf] block">${icons.code}</span>
          Fetching portfolio data...
        </div>
      </div>
    `;
    chatContainer.appendChild(thinkingDiv);
    scrollToBottom();
  }

  function removeThinking() {
    const indicator = document.getElementById('thinking-indicator');
    if (indicator) indicator.remove();
  }

  function scrollToBottom() {
    if (chatScrollArea) {
      chatScrollArea.scrollTo({ top: chatScrollArea.scrollHeight, behavior: 'smooth' });
    }
  }

  function toggleCommandMenu() {
    isCommandMenuOpen = !isCommandMenuOpen;
    commandMenu.classList.toggle('hidden', !isCommandMenuOpen);
    chevronIcon.classList.toggle('rotate-180', isCommandMenuOpen);
  }

  function handleCommand(query) {
    if (isCommandMenuOpen) toggleCommandMenu();
    addMessage('user', query);
    showThinking();

    setTimeout(() => {
      removeThinking();
      let responseElement = document.createElement('div');
      responseElement.className = 'space-y-6';
      const t = query.toLowerCase().trim();

      if (t.includes('about') || t.includes('who') || t.includes('background') || t.includes('biography')) {
        responseElement.innerHTML = `
          <div class="p-4 bg-[#2dd4bf]/5 border-l-4 border-[#2dd4bf] rounded-r-2xl">
             <p class="text-[#2dd4bf] font-bold text-sm mb-1">${PORTFOLIO_DATA.about.role_split}</p>
             <p class="text-sm text-[#ececec]">${PORTFOLIO_DATA.about.content}</p>
          </div>
        `;
      } else if (t.includes('experience') || t.includes('work') || t.includes('history')) {
        let expHtml = `<p class="text-sm text-[#888]">Chronicle of professional engagements at Zoho and Virtusa:</p><div class="space-y-8 mt-4">`;
        PORTFOLIO_DATA.experience.forEach(exp => {
          expHtml += `
            <div class="relative pl-8 border-l border-white/10 group">
              <div class="absolute left-[-5px] top-2 w-2.5 h-2.5 rounded-full bg-[#2dd4bf] shadow-[0_0_10px_rgba(45,212,191,0.5)] transition-transform group-hover:scale-125"></div>
              <div class="mb-1 flex flex-wrap justify-between items-center gap-2">
                <h3 class="text-[#2dd4bf] font-bold">${exp.role}</h3>
                <span class="text-[10px] py-1 px-2 bg-white/5 rounded border border-white/10 text-white/40 uppercase tracking-widest">${exp.period}</span>
              </div>
              <p class="text-xs font-bold text-white mb-3">${exp.company}</p>
              <p class="text-sm text-[#888] leading-relaxed">${exp.desc}</p>
            </div>
          `;
        });
        expHtml += `</div>`;
        responseElement.innerHTML = expHtml;
      } else if (t.includes('skill') || t.includes('stack') || t.includes('tech') || t.includes('tool')) {
        let skillsHtml = `<p class="text-sm text-[#888]">Technical competence matrix categorized by layer:</p><div class="space-y-8 mt-4">`;
        PORTFOLIO_DATA.skills.forEach(cat => {
          skillsHtml += `
            <div class="space-y-3">
              <h4 class="text-[10px] font-bold text-white opacity-40 uppercase tracking-[0.2em]">${cat.category}</h4>
              <div class="flex flex-wrap gap-2">
                ${cat.items.map(item => `<span class="px-4 py-2 bg-[#2f2f2f] border border-[#3e3e3e] rounded-xl text-xs text-[#ececec] hover:border-[#2dd4bf] transition-colors">${item}</span>`).join('')}
              </div>
            </div>
          `;
        });
        skillsHtml += `</div>`;
        responseElement.innerHTML = skillsHtml;
      } else if (t.includes('project') || t.includes('build')) {
        let projectsHtml = `<p class="text-sm text-[#888]">Highlighting major full-stack and specialized systems:</p><div class="grid gap-4 mt-4">`;
        PORTFOLIO_DATA.projects.forEach(p => {
          projectsHtml += `
            <div class="p-6 bg-[#2f2f2f] border border-[#3e3e3e] rounded-3xl hover:border-[#2dd4bf]/40 transition-all">
              <div class="flex justify-between items-start mb-2">
                <h4 class="font-bold text-white text-lg">${p.name}</h4>
                <span class="text-[#676767]">${icons.external}</span>
              </div>
              <p class="text-sm text-[#888] mb-4 leading-relaxed">${p.desc}</p>
              <div class="flex items-center justify-between">
                <div class="px-3 py-1 bg-[#2dd4bf]/10 text-[#2dd4bf] rounded-full text-[10px] font-mono uppercase border border-[#2dd4bf]/20">
                  ${p.tech}
                </div>
                <span class="text-[10px] text-white/30 italic">${p.highlights}</span>
              </div>
            </div>
          `;
        });
        projectsHtml += `</div>`;
        responseElement.innerHTML = projectsHtml;
      } else if (t.includes('cert') || t.includes('credential') || t.includes('educat')) {
        let certHtml = `
          <div class="space-y-6">
            <div class="space-y-4">
              <p class="text-sm text-[#888]">Academic Background:</p>
              <div class="p-5 bg-[#2dd4bf]/5 border border-[#2dd4bf]/20 rounded-2xl">
                <h4 class="font-bold text-white text-sm">Bachelor of Technology (B.Tech)</h4>
                <p class="text-xs text-[#2dd4bf] mb-1">Information Technology</p>
                <p class="text-xs text-[#888]">R.M.D Engineering College, Kavarapettai</p>
                <p class="text-[10px] text-[#555] uppercase mt-2">2016 — 2020</p>
              </div>
            </div>
            <div class="space-y-4">
              <p class="text-sm text-[#888]">Professional Credentials & Certifications:</p>
              <div class="grid gap-4">
                ${PORTFOLIO_DATA.certifications.map(cert => `
                  <div class="p-5 bg-[#2f2f2f] border border-[#3e3e3e] rounded-2xl border-l-4 border-l-[#2dd4bf]">
                    <div class="flex justify-between items-start mb-2">
                      <h4 class="font-bold text-white text-sm">${cert.name}</h4>
                      <span class="text-[10px] text-[#2dd4bf] bg-[#2dd4bf]/10 px-2 py-0.5 rounded border border-[#2dd4bf]/20 uppercase">${cert.issuer}</span>
                    </div>
                    <p class="text-xs text-[#888] leading-relaxed">${cert.details}</p>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
        responseElement.innerHTML = certHtml;
      } else if (t.includes('contact') || t.includes('hire') || t.includes('email')) {
        responseElement.innerHTML = `
          <div class="space-y-6">
            <p class="text-sm text-[#888]">Secure communication channels are open:</p>
            <div class="grid sm:grid-cols-2 gap-4">
              <a href="mailto:nithish.vemal@gmail.com" class="flex items-center gap-4 p-4 bg-[#2f2f2f] border border-[#3e3e3e] rounded-2xl hover:bg-[#353535] transition-all">
                <div class="p-3 bg-[#2dd4bf]/10 text-[#2dd4bf] rounded-xl">${icons.mail}</div>
                <div>
                  <p class="text-[10px] text-[#676767] uppercase">Email</p>
                  <p class="text-sm font-bold text-white">nithish.vemal@gmail.com</p>
                </div>
              </a>
              <a href="https://in.linkedin.com/in/nithishsiddharthanvemal" target="_blank" class="flex items-center gap-4 p-4 bg-[#2f2f2f] border border-[#3e3e3e] rounded-2xl hover:bg-[#353535] transition-all">
                <div class="p-3 bg-blue-500/10 text-blue-500 rounded-xl">${icons.linkedin}</div>
                <div>
                  <p class="text-[10px] text-[#676767] uppercase">LinkedIn</p>
                  <p class="text-sm font-bold text-white">Nithish Siddharthan</p>
                </div>
              </a>
            </div>
          </div>
        `;
      } else {
        responseElement.innerHTML = `<p>Input not recognized. Please select a portfolio command.</p>`;
      }
      
      addMessage('assistant', responseElement);
    }, 1200);
  }

  // Initialization
  function init() {
    const welcomeElement = document.createElement('div');
    welcomeElement.className = 'space-y-6';
    welcomeElement.innerHTML = `
      <div class="inline-block p-2 bg-[#2dd4bf]/10 border border-[#2dd4bf]/20 rounded-lg mb-4">
        <span class="text-[10px] font-bold text-[#2dd4bf] uppercase tracking-widest">Active Portfolio Node</span>
      </div>
      <h1 class="text-2xl font-bold text-white leading-tight">Welcome to the Portfolio of <span class="text-[#2dd4bf]">Nithish Siddharthan</span>.</h1>
      <p class="text-[#ececec] opacity-80 leading-relaxed text-[15px]">
        I am a **Senior Web Developer** with a major focus on crafting high-performance Frontend architectures.
      </p>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-4" id="welcome-buttons"></div>
    `;
    
    messages.push({ id: Date.now(), role: 'assistant', content: welcomeElement });
    renderMessage(messages[0]);

    const welcomeButtons = document.getElementById('welcome-buttons');
    COMMANDS.forEach(cmd => {
      const btn = document.createElement('button');
      btn.className = 'flex items-center gap-3 p-4 bg-[#2f2f2f] border border-[#3e3e3e] rounded-2xl hover:border-[#2dd4bf]/40 hover:bg-[#353535] transition-all text-left group';
      btn.innerHTML = `
        <div class="p-2 bg-[#2dd4bf]/10 rounded-lg text-[#2dd4bf] group-hover:scale-110 transition-transform">${icons[cmd.icon]}</div>
        <span class="text-sm font-semibold text-[#ececec]">${cmd.label}</span>
      `;
      btn.onclick = () => handleCommand(cmd.query);
      welcomeButtons.appendChild(btn);
    });

    COMMANDS.forEach(cmd => {
      const btn = document.createElement('button');
      const iconKey = cmd.icon;
      btn.className = 'flex items-center gap-3 px-4 py-3 rounded-2xl hover:bg-[#353535] transition-colors text-left group w-full';
      btn.innerHTML = `
        <div class="text-[#2dd4bf] group-hover:scale-110 transition-transform">${icons[iconKey]}</div>
        <span class="text-sm text-[#ececec] font-medium">${cmd.label}</span>
      `;
      btn.onclick = () => handleCommand(cmd.query);
      commandMenuGrid.appendChild(btn);
    });
  }

  commandTrigger.onclick = toggleCommandMenu;

  document.addEventListener('click', (e) => {
    if (!commandTrigger.contains(e.target) && !commandMenu.contains(e.target) && isCommandMenuOpen) {
      toggleCommandMenu();
    }
  });

  init();
});
    </script>
  </body>
</html>
